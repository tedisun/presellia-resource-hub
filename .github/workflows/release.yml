name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create plugin ZIP
        # Dossier racine presellia-resource-hub/ : WordPress remplace le bon dossier
        # lors d'une mise a jour (automatique ou par televersement).
        run: |
          mkdir -p build/presellia-resource-hub
          rsync -a ./ build/presellia-resource-hub/ \
            --exclude ".git*" \
            --exclude ".github" \
            --exclude "build" \
            --exclude "*.zip" \
            --exclude ".DS_Store" \
            --exclude "CLAUDE.md"
          cd build && zip -rq ../presellia-resource-hub.zip presellia-resource-hub

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: presellia-resource-hub.zip
          generate_release_notes: true
